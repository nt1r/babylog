name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  validate-and-test:
    name: Validate Tag, Changelog & Tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      major_minor: ${{ steps.meta.outputs.major_minor }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "backend/go.mod"
          cache-dependency-path: "backend/go.sum"

      - name: Validate tag format, main ancestry, package.json & CHANGELOG.md
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' 不符合语义化版本格式（如 v0.1.0 或 v0.1.0-rc.1）"
            exit 1
          fi

          VERSION="${TAG#v}"
          BASE_VERSION="${BASH_REMATCH[1]}"
          MAJOR_MINOR="v${BASE_VERSION%.*}"
          IS_PRERELEASE="false"
          if [[ -n "${BASH_REMATCH[2]:-}" ]]; then
            IS_PRERELEASE="true"
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::Tag '${TAG}' (${GITHUB_SHA}) 不在 main 分支历史内，请先通过 PR 将 dev 合入 main 再打标签"
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag 版本 (${VERSION}) 与 package.json version (${PKG_VERSION}) 不一致"
            exit 1
          fi

          VERSION="$VERSION" node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION;
            const text = fs.readFileSync("CHANGELOG.md", "utf8");
            const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const startRe = new RegExp(`^## \\[${escaped}\\](?:\\s|$)`, "m");
            const startMatch = startRe.exec(text);
            if (!startMatch) {
              console.error(`CHANGELOG.md 中未找到对应版本章节：## [${version}]`);
              process.exit(1);
            }
            const rest = text.slice(startMatch.index + startMatch[0].length);
            const nextHeaderIdx = rest.search(/^## \[/m);
            const body = (nextHeaderIdx === -1 ? rest : rest.slice(0, nextHeaderIdx))
              .replace(/^[^\n]*\n?/, "")
              .trim();
            if (!body) {
              console.error(`CHANGELOG.md 中 ## [${version}] 章节内容为空`);
              process.exit(1);
            }
            fs.writeFileSync("release-notes.md", `${body}\n`, "utf8");
          '

          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "major_minor=${MAJOR_MINOR}"
            echo "commit=${COMMIT}"
            echo "build_date=${BUILD_DATE}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload extracted release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Backend tests
        run: pnpm test

  build-binaries:
    name: Build Cross-Platform Binaries
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "backend/go.mod"
          cache-dependency-path: "backend/go.sum"

      - name: Build frontend static assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build:web
          mkdir -p backend/internal/webui/dist
          find backend/internal/webui/dist -mindepth 1 ! -name .gitkeep -delete
          cp -R dist/. backend/internal/webui/dist/

      - name: Cross-compile binaries & package archives
        env:
          TAG: ${{ needs.validate-and-test.outputs.tag }}
          COMMIT: ${{ needs.validate-and-test.outputs.commit }}
          BUILD_DATE: ${{ needs.validate-and-test.outputs.build_date }}
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "$OUT_DIR"

          LDFLAGS="-s -w -X main.version=${TAG} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}"

          for TARGET in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${TARGET%/*}"
            GOARCH="${TARGET#*/}"
            STAGE_DIR="${RUNNER_TEMP}/pkg-${GOOS}-${GOARCH}"
            rm -rf "$STAGE_DIR"
            mkdir -p "$STAGE_DIR"

            (
              cd backend
              CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
                -tags embedwebui \
                -trimpath \
                -ldflags="$LDFLAGS" \
                -o "${STAGE_DIR}/babylog" \
                ./cmd/babylog
            )

            cp LICENSE README.md "$STAGE_DIR/"
            tar -czf "${OUT_DIR}/babylog_${TAG}_${GOOS}_${GOARCH}.tar.gz" -C "$STAGE_DIR" babylog LICENSE README.md
          done

          cp scripts/install.sh "${OUT_DIR}/install.sh"
          chmod 755 "${OUT_DIR}/install.sh"

          (
            cd "$OUT_DIR"
            sha256sum babylog_*.tar.gz install.sh > SHA256SUMS.txt
          )

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          retention-days: 1

  publish-docker:
    name: Build & Push Multi-Arch GHCR Image
    needs: validate-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker image tags
        id: docker_meta
        env:
          TAG: ${{ needs.validate-and-test.outputs.tag }}
          MAJOR_MINOR: ${{ needs.validate-and-test.outputs.major_minor }}
          IS_PRERELEASE: ${{ needs.validate-and-test.outputs.is_prerelease }}
        run: |
          IMAGE_REPO="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tags<<EOF"
            echo "${IMAGE_REPO}:${TAG}"
            if [[ "${IS_PRERELEASE}" != "true" ]]; then
              echo "${IMAGE_REPO}:${MAJOR_MINOR}"
              echo "${IMAGE_REPO}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            VERSION=${{ needs.validate-and-test.outputs.tag }}
            COMMIT=${{ needs.validate-and-test.outputs.commit }}
            BUILD_DATE=${{ needs.validate-and-test.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Publish GitHub Release
    needs: [validate-and-test, build-binaries, publish-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ./notes

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ./assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-and-test.outputs.tag }}
          IS_PRERELEASE: ${{ needs.validate-and-test.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          EXTRA_FLAGS=()
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            EXTRA_FLAGS+=(--prerelease --latest=false)
          else
            EXTRA_FLAGS+=(--latest)
          fi

          gh release create "${TAG}" \
            ./assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BabyLog ${TAG}" \
            --notes-file ./notes/release-notes.md \
            "${EXTRA_FLAGS[@]}"
