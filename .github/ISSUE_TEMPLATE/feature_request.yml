name: 功能建议
description: 提出新功能想法或现有体验改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与痛点
      description: 描述在日常育儿记录中遇到的问题或希望达成的目标。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你希望的交互、数据或功能形态。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他补充（可选）
