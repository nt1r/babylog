root = "."
tmp_dir = "tmp"

[build]
  cmd = "CGO_ENABLED=0 go build -o ./tmp/babylog ./cmd/babylog"
  entrypoint = ["./tmp/babylog", "serve"]
  delay = 300
  exclude_dir = ["tmp", "internal/webui/dist"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "sql"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
